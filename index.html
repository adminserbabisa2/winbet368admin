<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pencarian</title>
<style>
:root{--bg:#f5f7f8;--fg:#1c2226;--muted:#6b777f;--line:#d5dce0;--card:#fff;--accent:#128c7e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181b;--fg:#e8eef1;--muted:#8c99a1;--line:#2c373d;--card:#1b2428;--accent:#25d366;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181b;--fg:#e8eef1;--muted:#8c99a1;--line:#2c373d;--card:#1b2428;--accent:#25d366;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:520px}
h1{margin:0 0 24px;text-align:center;font:600 clamp(2.4rem,13vw,4.2rem)/1 "Product Sans","Google Sans",Poppins,"Trebuchet MS",system-ui,sans-serif;letter-spacing:-.02em}
.b{color:#4285f4}.r{color:#ea4335}.y{color:#fbbc05}.g{color:#34a853}
form{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px}
form:focus-within{border-color:var(--accent)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:0}
button{border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:8px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#msg{min-height:1.5em;margin:12px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1 aria-label="WINBET368"><span class="b">W</span><span class="r">I</span><span class="y">N</span><span class="b">B</span><span class="g">E</span><span class="r">T</span><span class="b">3</span><span class="r">6</span><span class="y">8</span></h1>
  <form id="f" autocomplete="off">
    <input id="q" type="search" placeholder="Cari..." aria-label="Cari">
    <button type="submit">Cari</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script>
(function(){
  var CODE = "winbet368";
  var WA = "https://wa.me/628318035328";
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var v = document.getElementById("q").value.trim().toLowerCase().replace(/\s+/g," ");
    var msg = document.getElementById("msg");
    if (v === CODE) {
      msg.textContent = "Mengalihkan...";
      window.location.href = WA;
    } else {
      msg.textContent = "Tidak ada hasil untuk \u201C" + document.getElementById("q").value.trim() + "\u201D.";
    }
  });
})();
</script>
</body>
</html>
